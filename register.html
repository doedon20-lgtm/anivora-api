<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create AniVora Developer Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #080b14;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .logo span {
      color: #8878ff;
    }

    .card {
      background: #101522;
      border: 1px solid #242c40;
      border-radius: 18px;
      padding: 30px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 9px;
    }

    .subtitle {
      color: #8e98ab;
      font-size: 14px;
      margin-bottom: 27px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      background: #080b14;
      border: 1px solid #30394f;
      border-radius: 9px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #8878ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #7868ff;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      font-size: 14px;
      word-break: break-word;
    }

    .success {
      display: block;
      background: #10271d;
      border: 1px solid #24563c;
      color: #8de4b2;
    }

    .error {
      display: block;
      background: #2a1519;
      border: 1px solid #633038;
      color: #ff9fa8;
    }

    .api-key {
      margin-top: 12px;
      padding: 12px;
      background: #080b14;
      border: 1px solid #30394f;
      border-radius: 7px;
      font-family: monospace;
      word-break: break-all;
      color: #bdb4ff;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      AniVora <span>API</span>
    </div>

    <div class="card">

      <h1>Create your developer account</h1>

      <p class="subtitle">
        Get started with AniVora API infrastructure.
      </p>

      <form id="registerForm">

        <label for="name">
          Name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Your name"
          required
        >

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          required
        >

        <button
          id="registerButton"
          type="submit"
        >
          Create Developer Account
        </button>

      </form>

      <div
        id="message"
        class="message"
      ></div>

    </div>

  </div>


  <script>

    const form =
      document.getElementById("registerForm");

    const button =
      document.getElementById("registerButton");

    const message =
      document.getElementById("message");


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const name =
          document.getElementById("name").value.trim();

        const email =
          document.getElementById("email").value.trim();


        button.disabled = true;

        button.textContent =
          "Creating account...";

        message.className =
          "message";

        message.style.display =
          "none";


        try {

          const response = await fetch(
            "/v1/register",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                name: name,
                email: email
              })
            }
          );


          const data =
            await response.json();


          if (!data.success) {

            throw new Error(
              data.error ||
              "Registration failed."
            );

          }


          message.className =
            "message success";

          message.style.display =
            "block";


          message.innerHTML = `
            <strong>Account created!</strong>
            <br><br>
            Your AniVora API key:
            <div class="api-key">
              ${data.api_key}
            </div>
            <br>
            Save this key securely.
          `;


          form.reset();


        } catch (error) {

          message.className =
            "message error";

          message.style.display =
            "block";

          message.textContent =
            error.message;

        }


        button.disabled = false;

        button.textContent =
          "Create Developer Account";

      }
    );

  </script>

</body>
  </html>
